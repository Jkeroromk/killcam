# Every push to main and every pull request: type-check and build the
# interface, run the Rust tests (screen-reading fixtures, League parsing,
# settings migration...). Nothing is packaged or published.
#
# Manual run ("Run workflow" on the Actions tab) instead builds the same
# installer as the release build and saves it under the run's Artifacts
# (was test-build.yml). It creates no Release, and installed copies get no
# update prompt.
name: 检查与测试打包

on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "*.md"]
  pull_request:
    paths-ignore: ["website/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      # tsc type-checks the whole interface; the Rust side embeds dist/
      - name: Build the interface
        run: npm run build

      - name: Rust tests
        shell: bash
        # failures also go to the run's annotations, readable without the full log
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E 'panicked at|left:|right:|FAILED|^error' test.log | head -30 | sed 's/^/::error::/'
            exit 1
          fi

  package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.bundle.json

      - name: Name the installer after this commit
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            Copy-Item $_.FullName ("out/" + $_.BaseName + "-test-" + $sha + ".exe")
          }
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: KillCam-test-${{ github.run_number }}
          path: out/*.exe
          retention-days: 7

      # after the upload, so a failing test still leaves an installer to try
      - name: Unit tests
        shell: bash
        # failures also go to the run's annotations, readable without the full log
        run: |
          set +e
          cargo test --release --manifest-path src-tauri/Cargo.toml --lib 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E 'panicked at|left:|right:|FAILED|^error' test.log | head -30 | sed 's/^/::error::/'
            exit 1
          fi
