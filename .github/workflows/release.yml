# Push a tag like v1.2 (scripts/release.ps1 does it) -> GitHub builds the
# installer, signs the update and publishes a release with latest.json, which
# installed copies of KillCam check for updates.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write
  deployments: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history + tags, for the commit list in the release notes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/prepare-ffmpeg.ps1

      - name: FFmpeg smoke test (the options KillCam records with)
        shell: pwsh
        run: |
          $ff = "src-tauri/bin/ffmpeg.exe"
          & $ff -version | Select-Object -First 1
          & $ff -hide_banner -loglevel error -y `
            -f lavfi -i "color=c=black:s=320x240:r=30" `
            -f lavfi -i "anullsrc=r=48000:cl=quad" -t 2 `
            -filter_complex "[1:a]asplit=2[a1][a2];[a1]pan=stereo|c0=c0|c1=c1[ga];[a2]pan=stereo|c0=c2|c1=c3[ma]" `
            -map 0:v -map "[ga]" -map "[ma]" -c:v libx264 -c:a aac -b:a 160k `
            -f segment -segment_time 10 -segment_format mpegts -reset_timestamps 1 `
            -segment_list smoke.csv -segment_list_type csv smoke_%05d.ts
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg smoke test failed" }
          & $ff -hide_banner -loglevel error -f f32le -ar 48000 -ch_layout quad -i NUL -t 0.1 -f null -
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg raw audio input options failed" }
          Remove-Item smoke* -ErrorAction SilentlyContinue

      # What changed, shown on the Release page and in KillCam's update prompt:
      # the notes written on the Release page if it was created there first,
      # otherwise the commit messages since the previous version.
      - name: Release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          # no Release yet (tag pushed by `npm run release`) -> the call fails, body stays empty
          body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.body // ""' 2>/dev/null)" || body=""
          if [ -z "$body" ]; then
            prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              body="$(git log "$prev..$tag" --no-merges --pretty='- %s' | grep -v -E '^- (v[0-9]+\.[0-9]+(\.[0-9]+)?$|Website)' || true)"
            fi
          fi
          [ -z "$body" ] && body="KillCam $tag"
          {
            echo "body<<__KILLCAM_NOTES__"
            echo "$body"
            echo "__KILLCAM_NOTES__"
          } >> "$GITHUB_OUTPUT"
          echo "$body"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KillCam ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.json

  # keep the Releases page to the newest three versions
  prune:
    needs: windows
    uses: ./.github/workflows/prune-releases.yml
